<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="css\navbar.css" type="text/css">
    <link rel="stylesheet" href="css/contact.css" type="text/css">
    <link rel="stylesheet" href="css\footer.css" type="text/css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
  </head>
  <body>
    <!-- Header Start -->
    <header class="sticky_navbar">
      <nav class="navbar">
        <div class="nav-logo">
          <img src="images\logo.png" alt="Logo">
        </div>
        <div class="nav-content">
        <a href="index.html">Home</a>  
        <a href="about.html">About</a> 
        <a href="services.html">Services</a>  
        <a href="crops.html">Crops</a> 
        <a href="contact.html">Contact Us</a>
        </div> 
      </nav>
    </header>
    <!-- Header End -->

    <main>
      <h1>Contact Us</h1>
      <section>
        <fieldset>
          <legend>Send Us a Message</legend>
          <form action="">
            <label>First Name</label>
            <input type="text" placeholder="Enter First Name" />
            <br /><br />

            <label>Last Name</label>
            <input type="text" placeholder="Enter Last Name" />
            <br /><br />

            <label>Email</label>
            <input type="email" placeholder="Enter Email" />
            <br /><br />

            <label>Message</label><br />
            <textarea rows="5" cols="30" placeholder="message"></textarea>
            <br /><br />

            <input type="submit" value="submit" />
          </form>
        </fieldset>
      </section>

      <section>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d236.67537431765686!2d75.92615114776648!3d18.3561334113965!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc508c12a02bd81%3A0xf3c488a7369a8aad!2sShri%20Hanuman%20Temple!5e0!3m2!1sen!2sin!4v1792215725606!5m2!1sen!2sin"
          width="600px"
          height="400"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </section>
    </main>

    <!-- footer -->
    <footer>
      <div class="footer">
        <h1 class="footer-title">CONTACT INFO</h1>
        <div class="footer-content">
          <div class="footer-contact">
            <i class="fa-solid fa-location-dot"></i>
            <p class="address contact-text">123 Grant St, Ste R,Denver, CO 80203</p>
          </div>

          <div class="footer-contact">
          <i class="fa-solid fa-phone"></i>
            <p class="phone contact-text">+1 (212) 555 - 4831</p>
          </div>

          <div class="footer-contact">
            <i class="fa-solid fa-envelope"></i>
            <p class="email contact-text">mayur@gmail.com</p>
          </div>
        </div>
        <div class="footer-copyright">
          <i class="fa-regular fa-copyright"></i>
          <p class="copyright-text">2026 Farmsathi.com</p>
        </div>
      </div>
    </footer>
  </body>
</html>
